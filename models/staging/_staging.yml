version: 2

models:
  - name: stg_customers
    description: One row per customer, cleaned from the raw customers seed.
    columns:
      - name: customer_id
        description: Primary key.
        data_tests:
          - unique
          - not_null
      - name: email
        data_tests:
          - not_null

  - name: stg_orders
    description: One row per order.
    columns:
      - name: order_id
        data_tests:
          - unique
          - not_null
      - name: customer_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_customers')
                field: customer_id
      - name: status
        data_tests:
          - accepted_values:
              arguments:
                values: ['placed', 'shipped', 'completed', 'returned']

  - name: stg_payments
    description: One row per payment, amounts converted from cents to dollars.
    columns:
      - name: payment_id
        data_tests:
          - unique
          - not_null
      - name: order_id
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_orders')
                field: order_id
      - name: payment_method
        data_tests:
          - accepted_values:
              arguments:
                values: ['credit_card', 'paypal', 'gift_card', 'bank_transfer']
